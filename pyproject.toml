[build-system]
requires = ["setuptools>=77"]
build-backend = "_build_hook"
backend-path = ["."]

[project]
name = "pgc-compiler"
version = "3.0.0"
description = "PGC protocol compiler — compiles governed declarations into sealed, verified projections (import package: compiler)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Bhash Ganti", email = "bachipeachy@gmail.com" }]

keywords = [
  "protocol-governed-computing",
  "pgc",
  "governance-compilation",
  "topology-compiler",
  "semantic-addressing",
  "authorization",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Compilers",
  "Topic :: System :: Distributed Computing",
]

dependencies = ["click", "pyyaml", "jsonschema"]

[project.scripts]
protocol_compiler = "compiler.cli:cli"

[project.urls]
Homepage = "https://omnibachi.org/"
Repository = "https://github.com/protocol-governed-computing/protocol_compiler"
Standard = "https://doi.org/10.5281/zenodo.22150616"

[tool.setuptools]
include-package-data = true

# Discovered rather than listed: the previous hardcoded list had fallen eight
# packages behind the tree, among them compiler.governance_engine and every
# assertion handler under it.
[tool.setuptools.packages.find]
where = ["."]
include = ["compiler*"]

[tool.setuptools.package-data]
# VERSION has no extension, so it needs naming explicitly — it carries the
# composition ordinal an installed wheel cannot otherwise reach.
"*" = ["*.md", "*.yaml", "*.json", "*.sh", "VERSION"]
